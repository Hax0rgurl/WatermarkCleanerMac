[project]
name = "mac-watermark-cleaner"
version = "2.1.0"
description = "Local video watermark restoration with E2FGVI-HQ and ProPainter"
readme = "README.md"
license = "Apache-2.0 AND MIT AND CC-BY-NC-4.0 AND LicenseRef-S-Lab-1.0 AND BSD-3-Clause AND CC0-1.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_LICENSES/*.txt",
    "watermark_cleaner/backends/**/LICENSE",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==19.0.2",
    "einops==0.8.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "numpy==2.5.1",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "scipy==1.18.0",
    "streamlit==1.60.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.5"]

[project.scripts]
mac-watermark-cleaner = "watermark_cleaner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "integration: requires local video tools",
    "model: downloads large model files",
]

[tool.setuptools.packages.find]
include = ["watermark_cleaner*"]

[tool.ruff]
line-length = 100
extend-exclude = ["watermark_cleaner/backends"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
watermark_cleaner = ["watermark_selector/*.html", "assets/*.png", "assets/*.svg", "assets/*.md", "backends/**/LICENSE*", "backends/**/UPSTREAM.md"]
