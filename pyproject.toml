[project]
name = "mac-watermark-cleaner"
version = "1.1.2"
description = "Universal Mac watermark cleaner powered by DeMark-World"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ffmpeg-python==0.2.0",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "numpy==2.5.1",
    "opencv-python==5.0.0.93",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "ruptures==1.1.20",
    "scikit-learn==1.9.0",
    "streamlit==1.60.0",
    "torch==2.13.0",
    "tqdm==4.70.0",
    "ultralytics==8.4.108",
]

[project.optional-dependencies]
temporal-cuda = [
    "mmcv>=2.0,<2.3",
    "mmengine>=0.10,<0.11",
    "torchvision>=0.20",
]
server = [
    "aiofiles>=24.1",
    "aiosqlite>=0.21",
    "fastapi>=0.108",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.35",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
mac-watermark-cleaner = "demark_world.cli:main"
sora-watermark-cleaner = "demark_world.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "integration: requires local video tools",
    "model: downloads large model files",
]

[tool.setuptools.packages.find]
include = ["demark_world*", "sorawm*"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
